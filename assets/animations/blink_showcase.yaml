name: blink_showcase
description: >
  Face-expression showcase: cycles through the expression library with blinks in
  between — demonstrates `hold: true` overlay keyframes (the blink moves only the
  eyelids; the body underneath never resets).
loop: false
keyframes:
  - pose: happy_idle
    duration_ms: 500
    easing: ease_out
    camera: { yaw_deg: 10.0, pitch_deg: 5.0, distance: 2.2, look_at: [0.0, 1.3, 0.0] }
  - joints:
      left_eyelid:
        rotation_deg: { x: 85.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: 85.0, y: 0.0, z: 0.0 }
    hold: true
    duration_ms: 90
    easing: step
  - pose: excited
    hold: true
    duration_ms: 700
    easing: ease_out
  - joints:
      left_eyelid:
        rotation_deg: { x: 85.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: 85.0, y: 0.0, z: 0.0 }
    hold: true
    duration_ms: 90
    easing: step
  - pose: tsundere
    hold: true
    duration_ms: 800
    easing: ease_out
  - pose: wink
    hold: true
    duration_ms: 900
    easing: ease_in_out
  - pose: sleepy
    hold: true
    duration_ms: 900
    easing: ease_in_out
  - pose: happy_idle
    duration_ms: 600
    easing: ease_in_out

name: dramatic_entrance
description: >
  Menacing look down with heavy lids... SNAP — head up with a furrowed glare...
  dramatic point with a camera rush-in. Classic villain/rival reveal.
loop: false
keyframes:
  - pose: dramatic_look
    duration_ms: 1200
    easing: ease_in_out
    camera: { yaw_deg: 40.0, pitch_deg: 6.0, distance: 5.5, look_at: [0.0, 0.7, 0.0] }
  - joints:
      neck:
        rotation_deg: { x: -5.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: -3.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 20.0, z: -50.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 20.0, z: -50.0 }
      left_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: 24.0 }
      right_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: -24.0 }
      left_eyelid:
        rotation_deg: { x: 18.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: 18.0, y: 0.0, z: 0.0 }
    duration_ms: 80
    easing: step
    camera: { yaw_deg: 25.0, pitch_deg: 10.0, distance: 3.0, look_at: [0.0, 1.2, 0.0] }
  - pose: angry_pose
    duration_ms: 700
    easing: ease_out
    camera: { yaw_deg: 2.0, pitch_deg: 3.0, distance: 1.4, look_at: [0.0, 1.6, 0.0] }

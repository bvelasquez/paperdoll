name: happy_bounce
description: >
  Cheer template: soft smile → morph blink → arms-up victory → fist pump peak →
  settle. Expressions ride on poses; blink uses hold:true + step. Gentle camera bounce.
loop: false
keyframes:
  - pose: hands_on_hips
    duration_ms: 320
    easing: ease_out
    expressions:
      happy: 0.7
    camera: { yaw_deg: 35.0, pitch_deg: 8.0, distance: 4.0, look_at: [0.0, 0.9, 0.0] }

  - expressions:
      blink: 1.0
      happy: 0.7
    hold: true
    duration_ms: 90
    easing: step

  - expressions:
      blink: 0.0
      happy: 0.85
    hold: true
    duration_ms: 100
    easing: ease_out

  - pose: victory
    duration_ms: 380
    easing: ease_out
    camera: { yaw_deg: 35.0, pitch_deg: 14.0, distance: 3.5, look_at: [0.0, 1.05, 0.0] }

  - pose: fist_pump_right
    duration_ms: 320
    easing: ease_in_out
    camera: { yaw_deg: 28.0, pitch_deg: 12.0, distance: 3.4, look_at: [0.05, 1.1, 0.0] }

  - pose: victory
    duration_ms: 280
    easing: ease_in_out
    camera: { yaw_deg: 40.0, pitch_deg: 10.0, distance: 3.9, look_at: [0.0, 1.0, 0.0] }

  - pose: idle
    duration_ms: 500
    easing: ease_in_out
    camera: { yaw_deg: 35.5, pitch_deg: 9.2, distance: 4.36, look_at: [0.0, 0.9, 0.0] }

name: hero_intro
description: >
  Wide establishing shot on idle, push-in to a wave, then settle — a short
  cinematic greeting for demos.
loop: false
keyframes:
  - pose: idle
    duration_ms: 0
    easing: linear
    camera:
      yaw_deg: 45.0
      pitch_deg: 18.0
      distance: 6.5
      look_at: [0.0, 0.85, 0.0]
  - pose: idle
    duration_ms: 800
    easing: ease_in_out
    camera:
      yaw_deg: 30.0
      pitch_deg: 10.0
      distance: 4.2
  - pose: wave
    duration_ms: 600
    easing: ease_out
    camera:
      yaw_deg: 15.0
      pitch_deg: 5.0
      distance: 3.4
      look_at: [0.15, 1.15, 0.0]
  - pose: wave_return
    duration_ms: 280
    easing: ease_in_out
  - pose: wave
    duration_ms: 280
    easing: ease_in_out
  - pose: idle
    duration_ms: 700
    easing: ease_in_out
    camera:
      yaw_deg: 35.5
      pitch_deg: 9.2
      distance: 4.36
      look_at: [0.0, 0.9, 0.0]

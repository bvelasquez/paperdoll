name: marionette_chaos
description: >
  Rapid, high-amplitude multi-limb chaos for V2: overlapping opposite-phase arm
  and leg motion, sudden step cuts, jaw chatter, and aggressive camera push/pull.
  Designed to make skinning artifacts, joint-limit weirdness, and mesh
  intersections obvious — a torture test more than a pretty dance.
loop: false
keyframes:
  - pose: t_pose
    duration_ms: 250
    easing: ease_out
    camera: { yaw_deg: 0.0, pitch_deg: 8.0, distance: 4.5 }

  - joints:
      left_shoulder:
        rotation_deg: { x: 0.0, y: -60.0, z: 80.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 60.0, z: -80.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -120.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 120.0 }
      left_hip:
        rotation_deg: { x: 45.0, y: 0.0, z: -20.0 }
      right_hip:
        rotation_deg: { x: 10.0, y: 0.0, z: 20.0 }
      left_knee:
        rotation_deg: { x: 90.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 15.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: 10.0, y: 25.0, z: 8.0 }
      chest:
        rotation_deg: { x: 6.0, y: 20.0, z: 6.0 }
      jaw:
        rotation_deg: { x: 25.0, y: 0.0, z: 0.0 }
    duration_ms: 280
    easing: ease_in_out
    camera: { yaw_deg: 45.0, pitch_deg: 12.0, distance: 3.5 }

  - joints:
      left_shoulder:
        rotation_deg: { x: 0.0, y: 60.0, z: -70.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: -60.0, z: 70.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 30.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -30.0 }
      left_wrist:
        rotation_deg: { x: 50.0, y: 0.0, z: -40.0 }
      right_wrist:
        rotation_deg: { x: -50.0, y: 0.0, z: 40.0 }
      left_hip:
        rotation_deg: { x: 10.0, y: 0.0, z: 25.0 }
      right_hip:
        rotation_deg: { x: 55.0, y: 0.0, z: -25.0 }
      left_knee:
        rotation_deg: { x: 20.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 100.0, y: 0.0, z: 0.0 }
      left_ankle:
        rotation_deg: { x: -15.0, y: 0.0, z: 0.0 }
      right_ankle:
        rotation_deg: { x: -25.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: -8.0, y: -30.0, z: -10.0 }
      chest:
        rotation_deg: { x: -6.0, y: -25.0, z: -8.0 }
      neck:
        rotation_deg: { x: 15.0, y: 35.0, z: 0.0 }
      head:
        rotation_deg: { x: 10.0, y: 25.0, z: 0.0 }
      jaw:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
    duration_ms: 280
    easing: ease_in_out
    camera: { yaw_deg: -40.0, pitch_deg: 5.0, distance: 3.2 }

  - joints:
      left_shoulder:
        rotation_deg: { x: 0.0, y: -30.0, z: 90.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: -30.0, z: -90.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -40.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 40.0 }
      left_hip:
        rotation_deg: { x: 30.0, y: 0.0, z: -30.0 }
      right_hip:
        rotation_deg: { x: 30.0, y: 0.0, z: 30.0 }
      left_knee:
        rotation_deg: { x: 60.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 60.0, y: 0.0, z: 0.0 }
      pelvis:
        rotation_deg: { x: -10.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: 20.0, y: 0.0, z: 0.0 }
      jaw:
        rotation_deg: { x: 35.0, y: 0.0, z: 0.0 }
    duration_ms: 80
    easing: step
    camera: { yaw_deg: 180.0, pitch_deg: 20.0, distance: 2.2, look_at: [0.0, 1.3, 0.0] }

  - joints:
      left_shoulder:
        rotation_deg: { x: 0.0, y: 40.0, z: -50.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 40.0, z: 50.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -110.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 110.0 }
      left_hip:
        rotation_deg: { x: 70.0, y: 0.0, z: 0.0 }
      right_hip:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
      left_knee:
        rotation_deg: { x: 20.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 10.0, y: 0.0, z: 0.0 }
      left_toe:
        rotation_deg: { x: 25.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: -15.0, y: 15.0, z: 0.0 }
      chest:
        rotation_deg: { x: -10.0, y: 10.0, z: 0.0 }
      neck:
        rotation_deg: { x: -20.0, y: 0.0, z: 0.0 }
      jaw:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
    duration_ms: 300
    easing: ease_out
    camera: { yaw_deg: 90.0, pitch_deg: -5.0, distance: 3.8, look_at: [0.0, 1.1, 0.0] }

  - hold: true
    duration_ms: 900
    easing: ease_in_out
    camera: { yaw_deg: 450.0, pitch_deg: 15.0, distance: 5.5, look_at: [0.0, 1.0, 0.0] }

  - pose: idle
    duration_ms: 600
    easing: ease_in_out
    camera: { yaw_deg: 35.5, pitch_deg: 9.2, distance: 4.36, look_at: [0.0, 0.9, 0.0] }

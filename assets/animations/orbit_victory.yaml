name: orbit_victory
description: >
  Strike a victory pose, then orbit the camera a full 360° while the body holds —
  demonstrates camera-only keyframes.
loop: false
keyframes:
  - pose: t_pose
    duration_ms: 0
    easing: linear
    camera:
      yaw_deg: 35.5
      pitch_deg: 9.2
      distance: 4.36
  - pose: victory
    duration_ms: 700
    easing: ease_out
    camera:
      yaw_deg: 25.0
      pitch_deg: 8.0
      distance: 4.0
  - camera:
      yaw_deg: 115.0
      pitch_deg: 12.0
      distance: 4.2
    duration_ms: 900
    easing: linear
  - camera:
      yaw_deg: 205.0
      pitch_deg: 10.0
      distance: 4.0
    duration_ms: 900
    easing: linear
  - camera:
      yaw_deg: 295.0
      pitch_deg: 8.0
      distance: 3.8
    duration_ms: 900
    easing: linear
  - camera:
      yaw_deg: 385.5
      pitch_deg: 9.2
      distance: 4.36
    duration_ms: 900
    easing: ease_in_out
  - pose: idle
    duration_ms: 600
    easing: ease_in_out
    camera:
      yaw_deg: 35.5
      pitch_deg: 9.2
      distance: 4.36

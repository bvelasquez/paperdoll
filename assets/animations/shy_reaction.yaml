name: shy_reaction
description: >
  Idle, then FULL-BODY SHOCK, then shyly look away blushing with a dreamy gaze.
  Camera orbits around to catch the blush.
loop: false
keyframes:
  - pose: idle
    duration_ms: 400
    easing: ease_out
    camera: { yaw_deg: 35.0, pitch_deg: 8.0, distance: 4.2, look_at: [0.0, 0.9, 0.0] }
  - pose: surprised_full
    duration_ms: 200
    easing: step
    camera: { yaw_deg: 35.0, pitch_deg: 12.0, distance: 2.8, look_at: [0.0, 1.1, 0.0] }
  - joints:
      neck:
        rotation_deg: { x: 0.0, y: -30.0, z: 12.0 }
      spine:
        rotation_deg: { x: -5.0, y: 0.0, z: 0.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: -50.0, z: 12.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 70.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: -50.0, z: -12.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -70.0 }
      left_eyelid:
        rotation_deg: { x: 20.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: 20.0, y: 0.0, z: 0.0 }
      left_pupil:
        translation: [0.006, 0.004, 0.012]
      right_pupil:
        translation: [0.006, 0.004, 0.012]
      left_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: -10.0 }
      right_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: 10.0 }
      jaw:
        rotation_deg: { x: 6.0, y: 0.0, z: 0.0 }
      left_blush:
        translation: [0.075, -0.025, 0.07]
      right_blush:
        translation: [-0.075, -0.025, 0.07]
    duration_ms: 800
    easing: ease_in_out
    camera: { yaw_deg: 75.0, pitch_deg: 10.0, distance: 2.8, look_at: [0.0, 1.3, 0.0] }

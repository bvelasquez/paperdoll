name: spine_wave
description: >
  Slow traveling wave through pelvis → spine → chest → upper_chest → neck → head,
  with mirrored arm undulation and a lazy camera arc. Exposes skinned-mesh
  deformation quality along the torso (where capsule dolls hide seams) and tests
  whether VRM upperChest/chest/spine mapping stays coherent under stacked twists.
loop: false
keyframes:
  - pose: idle
    duration_ms: 300
    easing: ease_out
    camera: { yaw_deg: 20.0, pitch_deg: 5.0, distance: 3.8, look_at: [0.0, 1.0, 0.0] }

  # Wave crest at pelvis / lower spine
  - joints:
      pelvis:
        rotation_deg: { x: 14.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: -6.0, y: 0.0, z: 0.0 }
      chest:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      upper_chest:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      neck:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      head:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 15.0, z: 25.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 15.0, z: -25.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -35.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 35.0 }
    duration_ms: 480
    easing: ease_in_out
    camera: { yaw_deg: 35.0, pitch_deg: 8.0, distance: 3.6 }

  # Crest moves to mid torso; arms reverse
  - joints:
      pelvis:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: 16.0, y: 0.0, z: 0.0 }
      chest:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      upper_chest:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      neck:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 10.0, z: -30.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 10.0, z: 30.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -20.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 20.0 }
    duration_ms: 480
    easing: ease_in_out
    camera: { yaw_deg: 50.0, pitch_deg: 6.0, distance: 3.5 }

  # Crest at chest / upper_chest
  - joints:
      pelvis:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      chest:
        rotation_deg: { x: 14.0, y: 0.0, z: 0.0 }
      upper_chest:
        rotation_deg: { x: -10.0, y: 0.0, z: 0.0 }
      neck:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 20.0, z: 40.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 20.0, z: -40.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -55.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 55.0 }
      left_wrist:
        rotation_deg: { x: 0.0, y: 0.0, z: -25.0 }
      right_wrist:
        rotation_deg: { x: 0.0, y: 0.0, z: 25.0 }
    duration_ms: 480
    easing: ease_in_out
    camera: { yaw_deg: 70.0, pitch_deg: 5.0, distance: 3.4 }

  # Crest exits through neck/head; add a yaw twist for shear
  - joints:
      pelvis:
        rotation_deg: { x: 0.0, y: 8.0, z: 0.0 }
      spine:
        rotation_deg: { x: 0.0, y: 10.0, z: 0.0 }
      chest:
        rotation_deg: { x: 0.0, y: 12.0, z: 0.0 }
      upper_chest:
        rotation_deg: { x: 8.0, y: 14.0, z: 0.0 }
      neck:
        rotation_deg: { x: 16.0, y: 18.0, z: 0.0 }
      head:
        rotation_deg: { x: 12.0, y: 20.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 5.0, z: -20.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 5.0, z: 20.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -30.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 30.0 }
      jaw:
        rotation_deg: { x: 10.0, y: 0.0, z: 0.0 }
    duration_ms: 520
    easing: ease_in_out
    camera: { yaw_deg: 100.0, pitch_deg: 4.0, distance: 3.3, look_at: [0.05, 1.2, 0.0] }

  # Second wave, opposite phase + deeper lateral bend
  - joints:
      pelvis:
        rotation_deg: { x: 0.0, y: -10.0, z: 10.0 }
      spine:
        rotation_deg: { x: 8.0, y: -12.0, z: 12.0 }
      chest:
        rotation_deg: { x: 6.0, y: -14.0, z: 10.0 }
      upper_chest:
        rotation_deg: { x: 4.0, y: -10.0, z: 6.0 }
      neck:
        rotation_deg: { x: -6.0, y: -16.0, z: -4.0 }
      head:
        rotation_deg: { x: -4.0, y: -12.0, z: 0.0 }
      left_clavicle:
        rotation_deg: { x: 0.0, y: 0.0, z: 10.0 }
      right_clavicle:
        rotation_deg: { x: 0.0, y: 0.0, z: -10.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 30.0, z: 55.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 30.0, z: -55.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -80.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 80.0 }
      jaw:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
    duration_ms: 700
    easing: ease_in_out
    camera: { yaw_deg: 160.0, pitch_deg: 10.0, distance: 4.0, look_at: [0.0, 1.0, 0.0] }

  - pose: idle
    duration_ms: 650
    easing: ease_in_out
    camera: { yaw_deg: 35.5, pitch_deg: 9.2, distance: 4.36, look_at: [0.0, 0.9, 0.0] }

name: sword_draw
description: >
  Iaido quick-draw: calm reach across to the hip, lightning-fast draw with a
  focused glare, then hold the finish. Bushido spirit.
loop: false
keyframes:
  - pose: idle
    duration_ms: 300
    easing: ease_out
    camera: { yaw_deg: 40.0, pitch_deg: 10.0, distance: 4.5, look_at: [0.0, 1.0, 0.0] }
  - joints:
      right_shoulder:
        rotation_deg: { x: 0.0, y: 55.0, z: 18.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 105.0 }
      right_wrist:
        rotation_deg: { x: 0.0, y: 0.0, z: 25.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 0.0, z: -40.0 }
      chest:
        rotation_deg: { x: 0.0, y: 10.0, z: 0.0 }
      neck:
        rotation_deg: { x: 5.0, y: 8.0, z: 0.0 }
      left_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: 15.0 }
      right_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: -15.0 }
      left_eyelid:
        rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
    duration_ms: 500
    easing: ease_in
    camera: { yaw_deg: 50.0, pitch_deg: 8.0, distance: 3.5, look_at: [0.0, 0.9, 0.0] }
  - joints:
      right_shoulder:
        rotation_deg: { x: 0.0, y: -40.0, z: -82.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -10.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 20.0, z: -55.0 }
      chest:
        rotation_deg: { x: 0.0, y: -15.0, z: 0.0 }
      neck:
        rotation_deg: { x: -3.0, y: -5.0, z: 0.0 }
      left_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: 20.0 }
      right_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: -20.0 }
      left_eyelid:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      right_eyelid:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      jaw:
        rotation_deg: { x: 10.0, y: 0.0, z: 0.0 }
    duration_ms: 100
    easing: step
    camera: { yaw_deg: 10.0, pitch_deg: 5.0, distance: 2.0, look_at: [0.0, 1.6, 0.0] }
  - joints:
      right_shoulder:
        rotation_deg: { x: 0.0, y: -30.0, z: -85.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -8.0 }
      chest:
        rotation_deg: { x: -3.0, y: -12.0, z: 0.0 }
      neck:
        rotation_deg: { x: -5.0, y: -10.0, z: 0.0 }
      left_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: 12.0 }
      right_eyebrow:
        rotation_deg: { x: 0.0, y: 0.0, z: -12.0 }
      jaw:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
    duration_ms: 600
    easing: ease_out
    camera: { yaw_deg: 5.0, pitch_deg: 8.0, distance: 2.3, look_at: [0.0, 1.5, 0.0] }

name: v2_stress_test
description: >
  V2 capability gauntlet: T-pose baseline → deep spine/chest twist with both arm
  chains fully articulated → weight-shifted crouch on one bent leg → reach overhead
  with opposite arm + jaw open → snap to wide stance with wrists rolled → full
  orbit camera while holding → settle idle. Stresses every mapped humanoid bone
  paperdoll drives on a skinned VRM (spine stack, clavicles, elbows, wrists,
  hips/knees/ankles/toes, jaw, eyes).
loop: false
keyframes:
  - pose: t_pose
    duration_ms: 350
    easing: ease_out
    camera: { yaw_deg: 0.0, pitch_deg: 6.0, distance: 4.2, look_at: [0.0, 1.0, 0.0] }

  # Extreme contralateral twist through the whole torso + opposite arm windmill
  - joints:
      pelvis:
        rotation_deg: { x: 0.0, y: -18.0, z: 0.0 }
      spine:
        rotation_deg: { x: 8.0, y: -22.0, z: 4.0 }
      chest:
        rotation_deg: { x: 6.0, y: -28.0, z: 6.0 }
      upper_chest:
        rotation_deg: { x: 4.0, y: -16.0, z: 4.0 }
      neck:
        rotation_deg: { x: -8.0, y: 35.0, z: 0.0 }
      head:
        rotation_deg: { x: 0.0, y: 20.0, z: 0.0 }
      left_clavicle:
        rotation_deg: { x: 0.0, y: 0.0, z: 12.0 }
      right_clavicle:
        rotation_deg: { x: 0.0, y: 0.0, z: -8.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: -40.0, z: 75.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -95.0 }
      left_wrist:
        rotation_deg: { x: 0.0, y: 25.0, z: -30.0 }
      left_hand:
        rotation_deg: { x: 0.0, y: 0.0, z: -15.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 55.0, z: 35.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 110.0 }
      right_wrist:
        rotation_deg: { x: 0.0, y: -20.0, z: 40.0 }
      jaw:
        rotation_deg: { x: 8.0, y: 0.0, z: 0.0 }
      left_eye:
        rotation_deg: { x: 0.0, y: 12.0, z: 0.0 }
      right_eye:
        rotation_deg: { x: 0.0, y: 12.0, z: 0.0 }
    duration_ms: 900
    easing: ease_in_out
    camera: { yaw_deg: -55.0, pitch_deg: 8.0, distance: 3.4, look_at: [0.15, 1.15, 0.0] }

  # Single-leg crouch / weight shift (right supporting, left knee high)
  - joints:
      pelvis:
        rotation_deg: { x: -6.0, y: 12.0, z: -8.0 }
      spine:
        rotation_deg: { x: 18.0, y: 10.0, z: -6.0 }
      chest:
        rotation_deg: { x: 10.0, y: 8.0, z: -4.0 }
      upper_chest:
        rotation_deg: { x: 4.0, y: 4.0, z: 0.0 }
      neck:
        rotation_deg: { x: 12.0, y: -15.0, z: 0.0 }
      head:
        rotation_deg: { x: 8.0, y: -10.0, z: 0.0 }
      right_hip:
        rotation_deg: { x: 28.0, y: 0.0, z: 8.0 }
      right_knee:
        rotation_deg: { x: 72.0, y: 0.0, z: 0.0 }
      right_ankle:
        rotation_deg: { x: -18.0, y: 0.0, z: 0.0 }
      right_toe:
        rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
      left_hip:
        rotation_deg: { x: 55.0, y: 0.0, z: -12.0 }
      left_knee:
        rotation_deg: { x: 95.0, y: 0.0, z: 0.0 }
      left_ankle:
        rotation_deg: { x: -10.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 25.0, z: -45.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -55.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 15.0, z: 25.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 40.0 }
      jaw:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
    duration_ms: 850
    easing: ease_in_out
    camera: { yaw_deg: 40.0, pitch_deg: 14.0, distance: 3.0, look_at: [0.0, 0.75, 0.0] }

  # Overhead reach + open jaw (asymmetry + face)
  - joints:
      pelvis:
        rotation_deg: { x: 4.0, y: -8.0, z: 4.0 }
      spine:
        rotation_deg: { x: -12.0, y: -10.0, z: 0.0 }
      chest:
        rotation_deg: { x: -8.0, y: -6.0, z: 0.0 }
      upper_chest:
        rotation_deg: { x: -4.0, y: 0.0, z: 0.0 }
      neck:
        rotation_deg: { x: -18.0, y: 0.0, z: 0.0 }
      head:
        rotation_deg: { x: -10.0, y: 0.0, z: 0.0 }
      right_hip:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
      left_hip:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 8.0, y: 0.0, z: 0.0 }
      left_knee:
        rotation_deg: { x: 8.0, y: 0.0, z: 0.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: -20.0, z: -88.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -15.0 }
      right_wrist:
        rotation_deg: { x: 0.0, y: 0.0, z: -25.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 50.0, z: 20.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -70.0 }
      left_wrist:
        rotation_deg: { x: 0.0, y: 15.0, z: -20.0 }
      jaw:
        rotation_deg: { x: 32.0, y: 0.0, z: 0.0 }
      left_eye:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      right_eye:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
    duration_ms: 700
    easing: ease_out
    camera: { yaw_deg: 15.0, pitch_deg: -4.0, distance: 2.6, look_at: [0.1, 1.55, 0.0] }

  # Snap: wide athletic stance, arms out, wrists rolled (step easing)
  - joints:
      pelvis:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      spine:
        rotation_deg: { x: 6.0, y: 0.0, z: 0.0 }
      chest:
        rotation_deg: { x: 4.0, y: 0.0, z: 0.0 }
      neck:
        rotation_deg: { x: -5.0, y: 0.0, z: 0.0 }
      head:
        rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
      left_hip:
        rotation_deg: { x: 12.0, y: 0.0, z: -18.0 }
      right_hip:
        rotation_deg: { x: 12.0, y: 0.0, z: 18.0 }
      left_knee:
        rotation_deg: { x: 28.0, y: 0.0, z: 0.0 }
      right_knee:
        rotation_deg: { x: 28.0, y: 0.0, z: 0.0 }
      left_ankle:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      right_ankle:
        rotation_deg: { x: -8.0, y: 0.0, z: 0.0 }
      left_shoulder:
        rotation_deg: { x: 0.0, y: 0.0, z: 55.0 }
      right_shoulder:
        rotation_deg: { x: 0.0, y: 0.0, z: -55.0 }
      left_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: -25.0 }
      right_elbow:
        rotation_deg: { x: 0.0, y: 0.0, z: 25.0 }
      left_wrist:
        rotation_deg: { x: 40.0, y: 0.0, z: 0.0 }
      right_wrist:
        rotation_deg: { x: -40.0, y: 0.0, z: 0.0 }
      jaw:
        rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
    duration_ms: 100
    easing: step
    camera: { yaw_deg: 0.0, pitch_deg: 10.0, distance: 4.8, look_at: [0.0, 0.95, 0.0] }

  # Hold body; orbit camera 270° around the figure
  - hold: true
    duration_ms: 1400
    easing: ease_in_out
    camera: { yaw_deg: 270.0, pitch_deg: 12.0, distance: 5.0, look_at: [0.0, 1.0, 0.0] }

  - pose: idle
    duration_ms: 700
    easing: ease_in_out
    camera: { yaw_deg: 35.5, pitch_deg: 9.2, distance: 4.36, look_at: [0.0, 0.9, 0.0] }

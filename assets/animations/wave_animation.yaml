name: wave_animation
description: >
  Authoring model for a simple pose-ref loop: anticipate raise, wave twice,
  settle. Body + expression come from the wave poses; soft camera stays put.
loop: false
play_automatically: true
keyframes:
  - pose: idle
    duration_ms: 200
    easing: ease_out
  - pose: wave
    duration_ms: 450
    easing: ease_out
  - pose: wave_return
    duration_ms: 280
    easing: ease_in_out
  - pose: wave
    duration_ms: 280
    easing: ease_in_out
  - pose: wave_return
    duration_ms: 260
    easing: ease_in_out
  - pose: wave
    duration_ms: 260
    easing: ease_in_out
  - pose: idle
    duration_ms: 550
    easing: ease_in_out

name: wave_animation
description: "Raise arm, wave twice, lower arm"
loop: false
keyframes:
  - pose: t_pose
    duration_ms: 0
    easing: linear
  - pose: wave
    duration_ms: 500
    easing: ease_in_out
  - pose: wave_return
    duration_ms: 300
    easing: ease_in_out
  - pose: wave
    duration_ms: 300
    easing: ease_in_out
  - pose: t_pose
    duration_ms: 600
    easing: ease_out

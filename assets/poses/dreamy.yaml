  right_pupil:
    translation: [0.0, 0.009, 0.012]
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -18.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 18.0 }
  jaw:
    rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
  left_blush:
    translation: [0.075, -0.025, 0.07]
  right_blush:
    translation: [-0.075, -0.025, 0.07]

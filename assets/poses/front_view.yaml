name: front_view
description: >
  Full-figure front view for proportion review: gentle smile with blush,
  camera straight-on (yaw 0) framing the figure head-to-feet.
joints:
  jaw:
    rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
  left_blush:
    translation: [0.075, -0.025, 0.07]
  right_blush:
    translation: [-0.075, -0.025, 0.07]
camera:
  yaw_deg: 0.0
  pitch_deg: 3.0
  distance: 3.6
  look_at: [0.0, 0.85, 0.0]

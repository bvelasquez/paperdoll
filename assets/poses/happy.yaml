name: happy
description: >
  Bright smile: brows raised, soft resting lids, mouth gently open, blush out.
  Face-only pose — as a direct /pose trigger it resets the body to rest; in
  animations use it as a `hold: true` keyframe to overlay the face onto any body.
joints:
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -14.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 14.0 }
  left_eyelid:
    rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
  right_eyelid:
    rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
  jaw:
    rotation_deg: { x: 14.0, y: 0.0, z: 0.0 }
  left_blush:
    translation: [0.075, -0.025, 0.07]
  right_blush:
    translation: [-0.075, -0.025, 0.07]

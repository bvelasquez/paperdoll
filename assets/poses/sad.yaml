name: sad
description: >
  Wistful: inner brows lifted gently, lids heavy, mouth barely parted. No blush.
  Face-only pose — pair with a body pose in an animation via `hold: true`.
joints:
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -10.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 10.0 }
  left_eyelid:
    rotation_deg: { x: 25.0, y: 0.0, z: 0.0 }
  right_eyelid:
    rotation_deg: { x: 25.0, y: 0.0, z: 0.0 }
  jaw:
    rotation_deg: { x: 4.0, y: 0.0, z: 0.0 }

name: side_view
description: >
  Full-figure side profile for proportion review (bust/waist/hip/buttock curves),
  camera at yaw 90 framing the figure head-to-feet.
joints:
  jaw:
    rotation_deg: { x: 5.0, y: 0.0, z: 0.0 }
camera:
  yaw_deg: 90.0
  pitch_deg: 3.0
  distance: 3.6
  look_at: [0.0, 0.85, 0.0]

name: surprised_face
description: >
  Full shock: brows at maximum height, eyelids pulled back (wide-eyed), jaw dropped
  open. Face-only pose — pair with the `surprised` body pose in an animation.
joints:
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -30.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 30.0 }
  left_eyelid:
    rotation_deg: { x: -12.0, y: 0.0, z: 0.0 }
  right_eyelid:
    rotation_deg: { x: -12.0, y: 0.0, z: 0.0 }
  jaw:
    rotation_deg: { x: 45.0, y: 0.0, z: 0.0 }

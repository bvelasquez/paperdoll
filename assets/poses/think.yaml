name: think
description: >
  Pensive pose: right hand up near the side of the head, head tilted toward it,
  left arm relaxed down. Demonstrates combining shoulder y (forward/back) with
  z (raise) plus a deep elbow bend.
joints:
  right_shoulder:
    rotation_deg: { z: -48.0, y: 60.0 }
  right_elbow:
    rotation_deg: { z: -135.0 }
  right_wrist:
    rotation_deg: { z: 45.0 }
  neck:
    rotation_deg: { z: 14.0, x: 10.0 }
  left_shoulder:
    rotation_deg: { z: -60.0 }
  left_elbow:
    rotation_deg: { z: -15.0 }

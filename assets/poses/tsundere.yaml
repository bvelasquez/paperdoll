name: tsundere
description: >
  "I-it's not like I like you or anything": angry furrowed brows AND glowing blush —
  the classic contradiction. Lids slightly lowered, mouth a small pout.
  Face-only pose.
joints:
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 20.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -20.0 }
  left_eyelid:
    rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
  right_eyelid:
    rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
  jaw:
    rotation_deg: { x: 8.0, y: 0.0, z: 0.0 }
  left_blush:
    translation: [0.075, -0.025, 0.07]
  right_blush:
    translation: [-0.075, -0.025, 0.07]

name: victory
description: >
  Both arms raised straight overhead in a cheer/victory stance. From T-pose,
  raising uses opposite signs on each side: right_shoulder.z negative,
  left_shoulder.z positive (see posing_guide).
joints:
  right_shoulder:
    rotation_deg: { z: -80.0 }
  left_shoulder:
    rotation_deg: { z: 80.0 }

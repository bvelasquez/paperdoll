name: wink
description: >
  Playful wink: left eyelid fully closed, right eye open and bright, brows raised,
  mouth smiling, blush out. Face-only pose.
joints:
  left_eyelid:
    rotation_deg: { x: 85.0, y: 0.0, z: 0.0 }
  right_eyelid:
    rotation_deg: { x: 0.0, y: 0.0, z: 0.0 }
  left_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: -16.0 }
  right_eyebrow:
    rotation_deg: { x: 0.0, y: 0.0, z: 16.0 }
  jaw:
    rotation_deg: { x: 12.0, y: 0.0, z: 0.0 }
  left_blush:
    translation: [0.075, -0.025, 0.07]
  right_blush:
    translation: [-0.075, -0.025, 0.07]
